<h1>rclone - personal backup client</h1>
<p>This Google OAuth client is used by one person to store their own encrypted backup files in their own Google Drive, using the open-source rclone tool (<a href="https://rclone.org">rclone.org</a>).</p>
<p>It is not offered to the public and has no other users.</p>
